name: Installers

# Builds the launcher's installers and portable zips on each platform, then installs and starts them, because a package
# that builds can still fail to run. With a tag, they are attached to that tag's release.
on:
  pull_request:
    paths:
      - .github/workflows/installers.yml
      - .github/actions/pack/**
      - dotnet-tools.json
      - RetooledLauncher/**
      - RetooledLauncher.Core/**
      - RetooledPatch/**
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installers to, such as v1.2.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || 'v0.0.1-dev' }}

jobs:
  windows:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Pinned, and checked against its publisher's signature, because the setup wizard is built from it.
      - name: Install Inno Setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download is-7_1_1 --repo jrsoftware/issrc --pattern innosetup-7.1.1-x64.exe --dir $env:RUNNER_TEMP
          $installer = Join-Path $env:RUNNER_TEMP innosetup-7.1.1-x64.exe
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike 'CN=Pyrsys B.V.,*') {
            throw "unexpected signature on the Inno Setup installer: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          $dir = Join-Path $env:RUNNER_TEMP inno
          Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/PORTABLE=1', '/CURRENTUSER', "/DIR=$dir" -Wait
          Get-Item (Join-Path $dir ISCC.exe)
          $dir >> $env:GITHUB_PATH

      - uses: ./.github/actions/pack
        with:
          tag: ${{ env.TAG }}
          rid: win-x64
          channel: windows-x64
          exe: RetooledLauncher.exe
          icon: icon.ico

      # Velopack's Setup.exe installs without asking anything, so the wizard installs the portable zip in its place,
      # under the same name. Velopack's is kept aside to test moving its installs over.
      - name: Build the setup wizard
        shell: pwsh
        run: |
          $portable = Join-Path $env:RUNNER_TEMP wizard-source
          Expand-Archive (Get-Item installers/*-Portable.zip).FullName $portable
          Move-Item installers/*-Setup.exe (Join-Path $env:RUNNER_TEMP velopack-setup.exe)
          ISCC /Q "/DSourceDir=$portable" "/DAppVersion=$($env:TAG.TrimStart('v'))" "/DChannel=windows-x64" `
            /Oinstallers RetooledLauncher/Installer/Setup.iss
          if ($LASTEXITCODE) { throw "ISCC exited with $LASTEXITCODE" }
          Get-Item installers/*-windows-x64-Setup.exe

      # Installs over what an earlier release's setup left, as an upgrading user would, then uninstalls.
      - name: Smoke test the setup wizard
        shell: pwsh
        run: |
          $old = Join-Path $env:LOCALAPPDATA KSPRetooled.Launcher
          $oldKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\KSPRetooled.Launcher'
          Start-Process (Join-Path $env:RUNNER_TEMP velopack-setup.exe) -ArgumentList '--silent' -Wait
          if (-not (Test-Path $oldKey)) { throw "Velopack's setup did not install" }
          Get-Process RetooledLauncher -ErrorAction SilentlyContinue | Stop-Process -Force -PassThru | Wait-Process

          $dir = Join-Path $env:RUNNER_TEMP launcher-install
          $log = Join-Path $env:RUNNER_TEMP setup.log
          $setup = (Get-Item installers/*-Setup.exe).FullName
          $run = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES',
            "/DIR=$dir", '/TASKS=desktopicon,startmenuicon', "/LOG=$log"
          if ($run.ExitCode) { Get-Content $log; throw "setup exited with $($run.ExitCode)" }
          if ((Test-Path $old) -or (Test-Path $oldKey)) { Get-Content $log; throw 'the earlier install is still there' }
          $shortcuts = @(
            Join-Path ([Environment]::GetFolderPath('Desktop')) 'KSP Retooled Launcher.lnk'
            Join-Path ([Environment]::GetFolderPath('Programs')) 'KSP Retooled Launcher.lnk'
          )
          foreach ($shortcut in $shortcuts) { if (-not (Test-Path $shortcut)) { throw "no shortcut at $shortcut" } }

          # The stub starts current/RetooledLauncher.exe and exits, so look for the launcher it started.
          Start-Process (Join-Path $dir 'KSP Retooled Launcher.exe')
          Start-Sleep 15
          $app = Get-Process RetooledLauncher -ErrorAction SilentlyContinue | Where-Object Path -like "$dir\*"
          if (-not $app) { throw 'the installed launcher is not running' }
          Stop-Process -InputObject $app
          $app | Wait-Process

          # The uninstaller copies itself elsewhere and returns at once, so wait for it to finish its work.
          $data = Join-Path $env:LOCALAPPDATA KSPRetooled/Launcher
          New-Item -ItemType Directory -Force $data | Out-Null
          Start-Process (Join-Path $dir unins000.exe) -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          $deadline = (Get-Date).AddMinutes(1)
          while ((Test-Path $dir) -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
          if (Test-Path $dir) { Get-ChildItem $dir -Recurse -Force; throw 'the uninstaller left the install folder' }
          foreach ($shortcut in $shortcuts) { if (Test-Path $shortcut) { throw "the uninstaller left $shortcut" } }
          if (Test-Path $data) { throw "the uninstaller left the launcher's data in $data" }

      # The zip's stub starts current/RetooledLauncher.exe and exits, so look for the launcher it started.
      - name: Smoke test the portable zip
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP portable
          Expand-Archive (Get-Item installers/*-Portable.zip).FullName $dir
          $stub = Get-ChildItem $dir -Filter *.exe | Where-Object Name -ne Update.exe
          Start-Process $stub.FullName
          Start-Sleep 15
          $app = Get-Process RetooledLauncher -ErrorAction SilentlyContinue | Where-Object Path -like "$dir\*"
          if (-not $app) { throw "the launcher from the portable zip is not running" }
          Stop-Process -InputObject $app

      - uses: actions/upload-artifact@v5
        with:
          name: installer-windows-x64
          if-no-files-found: error
          path: |
            installers/*-Setup.exe
            installers/*-Portable.zip
            installers/releases.*.json
            installers/*-full.nupkg

  linux:
    name: linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/pack
        with:
          tag: ${{ env.TAG }}
          rid: linux-x64
          channel: linux-x64
          icon: icon.png

      - name: Smoke test
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libice6 libsm6 libfontconfig1
          chmod +x installers/*.AppImage
          status=0
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 15 xvfb-run --auto-servernum installers/*.AppImage || status=$?
          [ "$status" -eq 124 ] || { echo "the launcher exited with $status"; exit 1; }

      - uses: actions/upload-artifact@v5
        with:
          name: installer-linux-x64
          if-no-files-found: error
          path: |
            installers/*.AppImage
            installers/releases.*.json
            installers/*-full.nupkg

  macos:
    name: ${{ matrix.channel }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64, channel: macos-arm64 }
          - { os: macos-15-intel, rid: osx-x64, channel: macos-x64 }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/pack
        with:
          tag: ${{ env.TAG }}
          rid: ${{ matrix.rid }}
          channel: ${{ matrix.channel }}
          icon: icon.icns
          # the installer's opening and closing pages
          pack-args: >-
            --instWelcome RetooledLauncher/Installer/macos-welcome.txt
            --instConclusion RetooledLauncher/Installer/macos-conclusion.txt

      - name: Smoke test
        run: |
          # the .app on its own, for those who would rather not run the installer
          ls installers/*-${{ matrix.channel }}-Portable.zip
          sudo installer -pkg installers/*.pkg -target /
          app=$(find /Applications "$HOME/Applications" -maxdepth 1 -name '*.app' -newer dotnet-tools.json | head -n 1)
          echo "installed $app"
          codesign --display --verbose=2 "$app" 2>&1 | head -n 12 || true
          "$app/Contents/MacOS/RetooledLauncher" &
          pid=$!
          sleep 15
          kill -0 "$pid" || { wait "$pid"; echo "the launcher exited with $?"; exit 1; }
          kill "$pid"

      # The same .app as the portable zip, so it updates itself once it is dragged to Applications. The user owns that
      # copy, so unlike the pkg's, replacing it needs no admin prompt. hdiutil sometimes fails with "Resource busy" on
      # hosted runners, so it gets a few tries.
      - name: Build the disk image
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          stage=$RUNNER_TEMP/dmg
          mkdir "$stage"
          ditto -x -k installers/*-"$CHANNEL"-Portable.zip "$stage"
          ln -s /Applications "$stage/Applications"
          for attempt in 1 2 3; do
            hdiutil create -volname "KSP Retooled Launcher" -srcfolder "$stage" -format UDZO -ov \
              "installers/KSPRetooled.Launcher-$CHANNEL.dmg" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep 10
          done
          ls -l installers/*.dmg

      # Copies the app out of the disk image as a user would, starts it, then updates it in place from a newer package
      # with the updater Velopack put in the bundle, which is what the launcher runs to update itself.
      - name: Smoke test the disk image and its updates
        env:
          CHANNEL: ${{ matrix.channel }}
          RID: ${{ matrix.rid }}
        run: |
          mount=$RUNNER_TEMP/mount
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "installers/KSPRetooled.Launcher-$CHANNEL.dmg"
          [ -L "$mount/Applications" ] || { echo "the disk image has no Applications link"; exit 1; }
          apps=$RUNNER_TEMP/Applications
          mkdir "$apps"
          name=$(cd "$mount" && ls -d *.app)
          ditto "$mount/$name" "$apps/$name"
          hdiutil detach "$mount"
          app=$apps/$name

          "$app/Contents/MacOS/RetooledLauncher" &
          pid=$!
          sleep 15
          kill -0 "$pid" || { wait "$pid"; echo "the launcher exited with $?"; exit 1; }
          kill "$pid"
          wait "$pid" || true

          next=999.0.0
          dotnet vpk pack --packId KSPRetooled.Launcher --packVersion "$next" \
            --packTitle "KSP Retooled Launcher" --packAuthors "KSP Retooled contributors" \
            --packDir publish --mainExe RetooledLauncher --icon RetooledLauncher/Icons/icon.icns \
            --runtime "$RID" --channel "$CHANNEL" --outputDir "$RUNNER_TEMP/next"
          "$app/Contents/MacOS/UpdateMac" apply --silent --norestart --verbose \
            --package "$(ls "$RUNNER_TEMP"/next/*-full.nupkg)"

          version=$(find "$app" -name sq.version -print -quit)
          [ -n "$version" ] || { echo "the updated app has no sq.version"; exit 1; }
          grep -q "<version>$next</version>" "$version" || { cat "$version"; echo "the app was not updated"; exit 1; }
          "$app/Contents/MacOS/RetooledLauncher" &
          pid=$!
          sleep 15
          kill -0 "$pid" || { wait "$pid"; echo "the updated launcher exited with $?"; exit 1; }
          kill "$pid"

      - uses: actions/upload-artifact@v5
        with:
          name: installer-${{ matrix.channel }}
          if-no-files-found: error
          path: |
            installers/*.dmg
            installers/*.pkg
            installers/*-Portable.zip
            installers/releases.*.json
            installers/*-full.nupkg

  attach:
    name: Attach to the release
    needs: [windows, linux, macos]
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers

      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" installers/* --clobber
